name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MonkeyTesting (editable, puts `mt` on PATH)
        run: python -m pip install -e .

      - name: mt install (Playwright packages and Chromium)
        run: mt install

      - name: mt doctor (informational; CI has no `claude` login)
        run: mt doctor
        continue-on-error: true

      - name: Unit tests (fake Claude, Jira stub, real Playwright on the demo app)
        run: python -m unittest discover -s tests -v
        env:
          PYTHONUTF8: "1"
